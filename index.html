<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sierpinski Carpet | WebGL</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f4f6fa; color: #172235; }
    main { max-width: 850px; margin: 30px auto; padding: 0 20px; }
    h1 { margin-bottom: 5px; }
    p { line-height: 1.55; }
    .panel { display: flex; flex-wrap: wrap; gap: 20px; align-items: end; padding: 16px; background: white; border: 1px solid #d9dfe8; border-radius: 10px; }
    label { display: grid; gap: 7px; font-weight: 600; }
    input[type="range"] { width: 220px; }
    input[type="color"] { width: 68px; height: 36px; padding: 0; border: 0; background: transparent; }
    .drawing { margin-top: 18px; background: white; border: 1px solid #d9dfe8; border-radius: 10px; padding: 15px; }
    canvas { display: block; width: min(100%, 680px); aspect-ratio: 1; margin: auto; }
    #status { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Sierpinski Carpet</h1>
    <p>정사각형을 3×3으로 나누고 가운데를 비우는 과정을 반복합니다.</p>
    <div class="panel">
      <label for="depth">분할 횟수 <output id="depth-value" for="depth">3</output>
        <input id="depth" type="range" min="0" max="5" value="3">
      </label>
      <label for="carpet-color">도형 색상
        <input id="carpet-color" type="color" value="#2658bd">
      </label>
      <label for="hole-color">빈 공간 색상
        <input id="hole-color" type="color" value="#ffffff">
      </label>
    </div>
    <div class="drawing"><canvas id="carpet" width="680" height="680" aria-label="Sierpinski Carpet 결과"></canvas></div>
    <p id="status" role="status" aria-live="polite">렌더링 준비 중</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
